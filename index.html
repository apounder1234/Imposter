<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup Imposter Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827, #000);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #d1d5db;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      transition: 0.2s;
    }

    button:hover {
      background: #3b82f6;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      transition: 0.2s;
    }

    .tab.active {
      background: #2563eb;
    }

    .word-box {
      margin-top: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 18px;
      padding: 24px;
    }

    .word {
      font-size: 2rem;
      font-weight: bold;
      margin: 15px 0;
    }

    .imposter {
      color: #fca5a5;
      font-weight: bold;
    }

    .normal {
      color: #86efac;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="game"></div>
  </div>

<script>
const players = ["Dominik", "Andrew", "Katrin", "Thilo"];

const worldCup = {
  europe: [
    ["France", "Germany", "Spain", "England"],
    ["Portugal", "Netherlands", "Belgium", "Croatia"],
    ["Austria", "Switzerland", "Turkey", "Sweden"],
    ["Scotland", "Norway", "Czechia", "Bosnia and Herzegovina"]
  ],

  concacaf: [
    ["Colombia", "Brazil", "Argentina", "Uraguay"],
    ["USA", "Canada", "Curaçao", "Haiti"]
  ]
};

let region = "europe";
let assignments = [];
let current = 0;
let revealed = false;

function setRegion(r) {
  region = r;
  render();
}

function shuffle(a) {
  const arr = [...a];

  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}

function startGame() {
  const sets = worldCup[region];

  const set = sets[Math.floor(Math.random() * sets.length)];

  const shuffled = shuffle(set);

  // 3 players get this team
  const commonTeam = shuffled[0];

  // 1 player gets different team
  const imposterTeam = shuffled[1];

  const imposterIndex = Math.floor(Math.random() * players.length);

  assignments = players.map((p, i) => ({
    player: p,
    word: i === imposterIndex ? imposterTeam : commonTeam,
    imposter: i === imposterIndex
  }));

  assignments = shuffle(assignments);

  current = 0;
  revealed = false;

  render();
}

function reveal() {
  revealed = true;
  render();
}

function next() {
  revealed = false;
  current++;
  render();
}

function render() {
  const g = document.getElementById("game");

  if (assignments.length === 0) {
    g.innerHTML = `
      <h1>⚽ World Cup Imposter</h1>

      <p>
        3 players get the SAME country.<br>
        1 player is the imposter.
      </p>

      <div class="tabs">
        <div class="tab ${region === 'europe' ? 'active' : ''}"
             onclick="setRegion('europe')">
          Europe
        </div>

        <div class="tab ${region === 'concacaf' ? 'active' : ''}"
             onclick="setRegion('concacaf')">
          CONCACAF
        </div>
      </div>

      <button onclick="startGame()">
        Start Game
      </button>
    `;

    return;
  }

  if (current >= assignments.length) {
    g.innerHTML = `
      <h1>🕵️ Discussion Time</h1>

      <p>
        Everyone has seen their country.<br>
        Find the imposter.
      </p>

      <button onclick="startGame()">
        Play Again
      </button>
    `;

    return;
  }

  const p = assignments[current];

  if (!revealed) {
    g.innerHTML = `
      <h1>Pass to ${p.player}</h1>

      <button onclick="reveal()">
        Reveal My Team
      </button>
    `;

  } else {

    g.innerHTML = `
      <h1>${p.player}</h1>

      <div class="word-box">

        <div class="word">
          ${p.word}
        </div>

        <div class="${p.imposter ? 'imposter' : 'normal'}">
          ${p.imposter ? '⚠ IMPOSTER' : '✅ NOT IMPOSTER'}
        </div>

      </div>

      <button onclick="next()">
        ${current === assignments.length - 1
          ? 'Start Discussion'
          : 'Next Player'}
      </button>
    `;
  }
}

render();
</script>
</body>
</html>
